<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bramble Hop — Day 1</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d2027; display: grid; place-items: center; overflow: hidden; }
    canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; image-rendering: pixelated; display: block; }
  </style>
</head>
<body>
  <canvas id="c" width="180" height="320"></canvas>
  <script type="module">
    import { BrambleSim, renderDay1 } from './engine.js';
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const sim = new BrambleSim({ scripted: false });
    const keys = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyJ: 'slash', KeyX: 'slash' };
    window.addEventListener('keydown', (e) => { if (keys[e.code]) sim.input[keys[e.code]] = true; });
    window.addEventListener('keyup', (e) => { if (keys[e.code]) sim.input[keys[e.code]] = false; });
    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      sim.step(dt);
      renderDay1(ctx, sim);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
